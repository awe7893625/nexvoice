name: test

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        working-directory: macos
        run: swift test
      - name: Shell and plist checks
        run: |
          zsh -n macos/scripts/build-app.sh macos/scripts/install-app.sh
          plutil -lint macos/Info.plist macos/NexVoice.entitlements
          git diff --check
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q server runtime
      - name: Install server test dependencies
        run: |
          # mlx-whisper (and its mlx dependency) only ships wheels for
          # Apple Silicon macOS, so it cannot be installed on this Linux
          # runner. Every mlx_whisper import in server/*.py is already
          # guarded/lazy (see stt_router.py, agent_cli.py, autotune.py),
          # specifically so most of the server test suite does not need it.
          # httpx2 is not in server/requirements.txt (it is only a transitive
          # dependency of mlx-whisper via huggingface_hub there) but
          # starlette's TestClient requires it directly, so it is installed
          # explicitly here for CI.
          grep -v '^mlx-whisper' server/requirements.txt > /tmp/server-requirements-ci.txt
          pip install -r /tmp/server-requirements-ci.txt pytest httpx2
      - name: Server + runtime tests
        run: |
          # test_cloud_enabled_default_and_key_not_enough and
          # test_privacy_mode_enforcement exercise the real local-transcription
          # code path (stt_router._run_local) rather than a mock, so they need
          # actual mlx-whisper -- which cannot run on this Linux runner (see
          # above). They still run in local/macOS dev (`pytest -q server
          # runtime` per README) where mlx-whisper is installed.
          python3 -m pytest -q server runtime \
            --deselect server/test_agent_api.py::test_cloud_enabled_default_and_key_not_enough \
            --deselect server/test_agent_api.py::test_privacy_mode_enforcement
